[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-pilot-mimo-ofdm-research"
version = "0.0.1"
description = "S0 research project setup and configuration checks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# optional figure-QA tooling; not a communication-simulation runtime dependency
figure-qa = ["PyMuPDF==1.28.2"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
